# Copy to config.local.toml. Use forward slashes in paths.

# REQUIRED - set these two folders first. Both are scanned recursively.
clips_dir = "I:/Video/Cut"
sources_dir = "I:/Video/Unsorted"

# OPTIONAL - filename matching. Check this if you use a custom export prefix.
# 'A1 CH01 Example' matches 'PRE A1 CH01 Example.mp4' with this default.
prefix = "PRE "
# Projects default to clips_dir. Set this only if your .llc files live elsewhere.
# projects_dir = "I:/Video/Projects"
# Exact associations for renamed/unnamed segments; see README.
# mapping_file = "mapping.local.json"

# OPTIONAL - output location. Omit to update exports in place with verified backups.
# Set this to make separate marked copies. Unchanged clips are not copied.
# output_dir = "I:/Video/Marked Copies"

# OPTIONAL - chapter and project cleanup. Both default to false.
# Remove existing chapters titled exactly Start or Unnamed N (N is a number).
# LLC point markers and the required MP4/MOV Clip start chapter are preserved.
# Preview lists the placeholders that would be excluded before Apply changes files.
remove_placeholder_chapters = false
# Back up and delete an .llc only after ALL its exports and markers are verified.
# Preview never deletes projects. Restore the project backup for later edits.
delete_projects_after_success = false

# OPTIONAL - dependencies. Change only if the tools are not available on PATH.
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"

# OPTIONAL - storage. Defaults to .llc-markers-work inside this repo, ignored by Git.
# Contains temporary media AND persistent backups, reports, and processing state.
# Use run.cmd's safe reset to preserve this data when rebuilding the environment.
# work_dir = "G:/MarkerWork"
